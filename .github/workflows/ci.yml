name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source and run tests
        run: npm run check

      - name: Reject committed production identifiers
        run: |
          oauth_pattern='[0-9]{6,}-[a-z0-9]{20,}\.apps\.googleusercontent\.com'
          public_key_prefix='MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8''A'
          account_field='"account_''id"'
          if grep -RInI --exclude-dir=.git --exclude-dir=.build --exclude='*.zip' \
            -E "$oauth_pattern|$public_key_prefix|$account_field" .; then
            echo "A production identifier or local account cache was found." >&2
            exit 1
          fi

      - name: Build sanitized test package
        env:
          GOOGLE_OAUTH_CLIENT_ID: 000000000000-ci-placeholder.apps.googleusercontent.com
        run: ./scripts/build-release.sh
